anaconda_config_version: 1
upstream_sources:
  - github:
      identifier: nvidia/cutlass
      use_max_tag: true
      exclude_regex: (?i)^(?=.*(?:(?<=\d)rc\d*|(?<=\d)dev\d+|(?:^|[-._])(?:alpha|beta|gamma|pre|preview)(?:\d+)?|[-._]rc\d+|(?:^|[-._])dev\d+|(?:\d+\.)+\d+[ab]\d*)).+$
      from_pattern: ^v?(\d+(?:\.\d+)*.*)$
      to_pattern: \1
  - webpage:
      url: https://api.anaconda.org/package/conda-forge/cutlass
      regex: '"version":\s*"([^"]+)"'
