{% set version = "4.8.1" %}

package:
  name: cutlass
  version: {{ version }}

source:
  url: https://github.com/NVIDIA/cutlass/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 71fc2892e8bcd929398b5aa72e3393af1bad0cae9814cd75661ca88e688c2159

build:
  number: 0
  skip: true  # [osx or cuda_compiler_version == "None"]
  ignore_run_exports_from:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('cuda') }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('cuda') }}
    - cmake
    - ninja-base

test:
  commands:
    # headers
    - test -f $PREFIX/include/cutlass/cutlass.h  # [linux]
    - test -f $PREFIX/include/cutlass/version.h  # [linux]
    - test -f $PREFIX/include/cute/tensor.hpp  # [linux]
    - test -f $PREFIX/include/cute/arch/mma_sm107_umma.hpp  # [linux]
    - if not exist %LIBRARY_INC%\cutlass\cutlass.h exit 1  # [win]
    - if not exist %LIBRARY_INC%\cutlass\version.h exit 1  # [win]
    - if not exist %LIBRARY_INC%\cute\tensor.hpp exit 1  # [win]
    - if not exist %LIBRARY_INC%\cute\arch\mma_sm107_umma.hpp exit 1  # [win]
    # CMake package config
    - test -f $PREFIX/lib/cmake/NvidiaCutlass/NvidiaCutlassConfig.cmake  # [linux]
    - test -f $PREFIX/lib/cmake/NvidiaCutlass/NvidiaCutlassConfigVersion.cmake  # [linux]
    - if not exist %LIBRARY_LIB%\cmake\NvidiaCutlass\NvidiaCutlassConfig.cmake exit 1  # [win]
    - if not exist %LIBRARY_LIB%\cmake\NvidiaCutlass\NvidiaCutlassConfigVersion.cmake exit 1  # [win]
    # version metadata
    - grep -q 'CUTLASS_PATCH {{ version.split(".")[2] }}' $PREFIX/include/cutlass/version.h  # [linux]
    - grep -q 'CUTLASS_REVISION "{{ version }}"' $PREFIX/include/cutlass/version_extended.h  # [linux]
    - grep -q 'set(PACKAGE_VERSION "{{ version }}")' $PREFIX/lib/cmake/NvidiaCutlass/NvidiaCutlassConfigVersion.cmake  # [linux]
    - findstr /C:"CUTLASS_PATCH {{ version.split(".")[2] }}" %LIBRARY_INC%\cutlass\version.h  # [win]
    - findstr /C:"CUTLASS_REVISION" %LIBRARY_INC%\cutlass\version_extended.h  # [win]
    - findstr /C:"{{ version }}" %LIBRARY_INC%\cutlass\version_extended.h  # [win]
    - findstr /C:"PACKAGE_VERSION" %LIBRARY_LIB%\cmake\NvidiaCutlass\NvidiaCutlassConfigVersion.cmake  # [win]
    - findstr /C:"{{ version }}" %LIBRARY_LIB%\cmake\NvidiaCutlass\NvidiaCutlassConfigVersion.cmake  # [win]

about:
  home: https://github.com/NVIDIA/cutlass
  license: BSD-3-Clause
  license_file: LICENSE.txt
  license_family: BSD
  summary: CUDA Templates for Linear Algebra Subroutines
  description: |
    CUTLASS is a collection of abstractions for implementing high-performance matrix-matrix multiplication (GEMM) and
    related computations at all levels and scales within CUDA. It incorporates strategies for hierarchical decomposition
    and data movement. CUTLASS decomposes these "moving parts" into reusable, modular software components and abstractions.
  doc_url: https://docs.nvidia.com/cutlass
  dev_url: https://github.com/NVIDIA/cutlass

extra:
  skip-lints:
    - deprecate_license_url
  recipe-maintainers:
    - conda-forge/cuda
    - h-vetinari
    - RaulPPelaez
    - leofang
